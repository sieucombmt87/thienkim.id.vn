<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thiên Kim Module Router</title>
  <script>
    // Giữ nguyên URL cũ của Card 2: /pages/module.html?module=academy
    // Nếu là academy thì chuyển sang app học tập mới.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var moduleName = params.get('module');
      if (moduleName === 'academy') {
        window.location.replace('/apps/edu-lab/');
      }
    })();
  </script>
</head>
<body>
  <p>Đang mở module...</p>
</body>
</html>
