<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API Debug - THIENKIM</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="module-page">
  <main class="module-shell">
    <section class="module-card">
      <h1>API DEBUG</h1>
      <p>Trang này dùng để test Apps Script Web App.</p>
      <div class="unified-login-form">
        <label>Username</label>
        <input id="u" placeholder="username">
        <label>Password</label>
        <input id="p" placeholder="password">
        <button class="login-submit" id="test">Test Login API</button>
        <pre id="out" style="white-space:pre-wrap;text-align:left;margin-top:18px"></pre>
      </div>
    </section>
  </main>
  <script src="config/google-sheet.js"></script>
  <script>
    document.getElementById('test').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = 'Đang test...';
      const data = await apiLogin(document.getElementById('u').value, document.getElementById('p').value);
      out.textContent = JSON.stringify(data, null, 2);
    };
  </script>
<div id="buildVersion" title="THIENKIM build version">TKver3.3</div>
</body>
</html>
