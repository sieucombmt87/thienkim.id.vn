<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - THIENKIM UNIVERSE</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
  <div class="galaxy-bg">
    <div class="starfield layer-1"></div>
    <div class="starfield layer-2"></div>
    <div class="sparkles"></div>
    <div class="cloud cloud-left"></div>
    <div class="cloud cloud-right"></div>
  </div>

  <main class="login-layout">
    <a href="index.html" class="back-link">← Về trang chủ</a>

    <section class="login-panel unified-login-panel" aria-label="Đăng nhập Thiên Kim Universe">
      <button class="login-star-logo top-mini-star" id="loginStarLogo" type="button" aria-label="Admin gateway">
        <img src="assets/images/ui/admin-star.png" alt="">
      </button>

      <h1>THIENKIM UNIVERSE</h1>
      <div class="login-mode-chip center-mode-chip" id="loginModeChip">ADMIN GATEWAY</div>
      <div class="admin-clock-row" id="adminLoginClock">🕒 --:--:--</div>

      <form id="loginForm" class="unified-login-form">
        <label>Tài khoản</label>
        <input id="username" name="username" autocomplete="username" placeholder="Nhập tài khoản" required>

        <label>Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>

        <label class="remember">
          <input id="remember" type="checkbox" checked>
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <button type="submit" class="login-submit">Đăng nhập →</button>
        <div id="loginMessage" class="login-message"></div>
      </form>
    </section>
  </main>

  <script src="config/google-sheet.js"></script>
  <script src="assets/js/auth.js"></script>
<div id="buildVersion" title="THIENKIM build version">TKver3.1</div>
</body>
</html>
