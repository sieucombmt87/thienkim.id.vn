<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile Manager</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="admin-page profile-manager-page"><aside class="admin-sidebar"><div class="admin-logo">✦ <span>Profile<br>Manager</span></div><div id="adminUserBox" class="admin-user">Đang kiểm tra...</div><nav><a href="index.html">Dashboard</a><a href="../me/index.html">Xem Flex Profile</a><a href="../index.html">Trang chủ</a></nav><button id="adminLogout">Đăng xuất</button></aside><main class="admin-main"><h1>Flex Profile Manager</h1><p>Thêm bài viết có năm/tháng, cover và nhiều hình ảnh. Bản này lưu test bằng LocalStorage.</p><section class="manager-grid"><form id="profilePostForm" class="manager-form"><label>Tiêu đề</label><input id="postTitle" required><div class="form-row"><div><label>Năm</label><input id="postYear" type="number" value="2026" required></div><div><label>Tháng</label><input id="postMonth" type="number" min="1" max="12" value="6" required></div><div><label>Ngày</label><input id="postDate" type="date" required></div></div><label>Danh mục</label><select id="postCategory"><option>Nhật ký</option><option>Thành tích</option><option>Mục tiêu</option><option>Hình ảnh</option></select><label>Ảnh cover URL/path</label><input id="postCover" placeholder="assets/uploads/profile/2026/06/ten-anh.jpg"><label>Danh sách ảnh, mỗi dòng 1 ảnh</label><textarea id="postImages" rows="4"></textarea><label>Nội dung</label><textarea id="postContent" rows="7" required></textarea><button type="submit">Lưu bài viết</button></form><section class="manager-preview"><h2>Bài đã lưu tạm</h2><div id="savedPosts"></div><button id="exportPosts">Copy JSON</button><textarea id="exportBox" rows="10" readonly></textarea></section></section></main><script src="../config/google-sheet.js"></script><script src="../assets/js/profile-manager.js"></script></body></html>
