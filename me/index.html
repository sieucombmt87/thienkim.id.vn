<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flex Profile - THIENKIM</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body class="profile-page"><div class="galaxy-bg"><div class="starfield layer-1"></div><div class="starfield layer-2"></div><div class="sparkles"></div><div class="cloud cloud-left"></div><div class="cloud cloud-right"></div></div>
<main class="profile-shell"><a href="../index.html" class="back-link">← Về trang chủ</a>
<section class="profile-hero-card"><div class="profile-avatar-wrap"><img id="profileAvatar" src="../assets/images/ui/admin-star.png"></div><div class="profile-hero-copy"><span class="profile-kicker">ME.THienKim</span><h1 id="profileName">Thiên Kim</h1><p id="profileSubtitle"></p><div id="profileSocials" class="profile-socials"></div></div><div class="profile-qr"><img id="profileQr" src="../assets/images/ui/admin-star.png"><span>QR Contact</span></div></section>
<section class="profile-tabs"><button class="active" data-tab="timeline">📖 Nhật ký</button><button data-tab="achievements">🏆 Thành tích</button><button data-tab="goals">🎯 Mục tiêu</button><button data-tab="gallery">🖼️ Thư viện ảnh</button></section>
<section class="profile-layout"><aside class="profile-filter-card"><h3>Lọc thời gian</h3><label>Năm</label><select id="yearFilter"></select><label>Tháng</label><select id="monthFilter"></select><button id="clearFilter">Xem tất cả</button><div class="profile-intro"><h3>Giới thiệu</h3><p id="profileIntro"></p></div></aside>
<section class="profile-content-card"><div id="timelineView" class="profile-tab-view"></div><div id="achievementsView" class="profile-tab-view hidden"></div><div id="goalsView" class="profile-tab-view hidden"></div><div id="galleryView" class="profile-tab-view hidden"></div></section></section></main>
<div id="imageLightbox" class="image-lightbox hidden"><button id="closeLightbox">×</button><img id="lightboxImg"></div>
<script src="../config/google-sheet.js"></script><script src="../assets/js/profile.js"></script><div id="buildVersion" title="THIENKIM build version">TKver3.2</div>
</body></html>
