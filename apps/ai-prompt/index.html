<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Prompt - THIENKIM</title><link rel="stylesheet" href="../../assets/css/style.css"><script>
(function(){
  try{
    const user = JSON.parse(localStorage.getItem("tk_user") || sessionStorage.getItem("tk_user") || "null");
    const vip = JSON.parse(localStorage.getItem("tk_vip_session") || "null");
    const ok = user && (user.all_access || user.role==="Admin" || user.role==="VIP" || user.vip_access==="Y" || user.ai_prompt==="Y" || (vip && Date.now()-vip.created_at < 86400000));
    if(!ok) location.href="../../login.html?mode=vip&next=app";
  }catch(e){ location.href="../../login.html?mode=vip&next=app"; }
})();
</script></head>
