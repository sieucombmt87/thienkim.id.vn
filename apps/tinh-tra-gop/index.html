<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tính Trả Góp • TKver8.6</title>
<link rel="stylesheet" href="../_shared/app-lite.css?v=TKver8.6">
</head>
<body>
<main class="app-shell">
  <a class="back" href="../index.html">← App Center</a>
  <section class="hero">
    <h1>Tính Trả Góp</h1>
    <span class="ver">TKver8.6</span>
  </section>
  
<section class="grid">
 <div class="card">
  <label>Tên sản phẩm</label><input id="name" placeholder="Điện thoại / Laptop...">
  <label>Giá bán</label><input id="price" inputmode="numeric" value="12000000">
  <label>Trả trước (%)</label><input id="pre" inputmode="numeric" value="30">
  <label>Số tháng</label><select id="months"><option>6</option><option>9</option><option>12</option><option>18</option><option>24</option></select>
  <label>Lãi suất/tháng (%)</label><input id="rate" inputmode="decimal" value="0">
  <label>Phí thu hộ</label><input id="fee" inputmode="numeric" value="11000">
  <div class="btns"><button class="btn" id="calcBtn">Tính</button><button class="btn alt" id="copyBtn">Copy</button><button class="btn red" id="clearBtn">Reset</button></div>
 </div>
 <div class="card"><h2>Kết quả</h2><div class="result" id="result">Chưa tính.</div></div>
</section>
</main>
<script src="app.js?v=TKver8.6"></script>

</body>
</html>
