<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TK Reader - THIENKIM</title><link rel="stylesheet" href="./style.css?v=TKver4.6"></head>
<body><main class="reader-shell">
<header class="reader-top"><a href="../index.html">← App Center</a><h1>📚 TK Reader</h1><button id="settingsBtn">⚙</button></header>
<section class="reader-panel">
  <div class="reader-actions">
    <input id="localFiles" type="file" accept=".txt,.html,.htm,.pdf,.epub,.jpg,.jpeg,.png,.webp" multiple>
    <input id="driveApi" placeholder="Apps Script / Drive JSON URL để tự cập nhật thư viện">
    <button id="loadDriveBtn">Làm mới Drive</button>
  </div>
  <div class="reader-cats" id="categoryList"></div>
  <div class="book-grid" id="bookGrid"></div>
</section>
<section class="reader-modal hidden" id="readerModal">
  <div class="reader-bar"><button id="closeReader">×</button><select id="themeSelect"><option value="paper">Paper</option><option value="true">True Tone</option><option value="dark">Dark</option><option value="light">Light</option></select><button id="savePos">Lưu vị trí</button></div>
  <article class="reader-content paper" id="readerContent"></article>
</section>
</main><script src="./app.js?v=TKver4.6"></script><div id="buildVersion">TKver4.6</div></body></html>
