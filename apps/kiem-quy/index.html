<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="App kiểm quỹ - ThienKim">
    <link rel="manifest" href="manifest.json">
    <title>Kiểm Quỹ - ThienKim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 16px 0;
            margin-bottom: 16px;
        }

        header h1 {
            color: #1565c0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header p {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Expected Input */
        .expected-input-wrapper {
            padding: 8px 0;
        }

        .expected-input-wrapper label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .expected-input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            text-align: right;
            font-family: 'Roboto', sans-serif;
            color: #1565c0;
        }

        .expected-input-wrapper input:focus {
            outline: none;
            border-color: #1e88e5;
        }

        /* Result Card */
        .result-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .result-main {
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, #1565c0 0%, #1976d2 100%);
            border-radius: 12px;
            color: white;
            margin-bottom: 12px;
        }

        .result-main .label {
            font-size: 12px;
            opacity: 0.85;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-main .amount {
            font-size: 32px;
            font-weight: 700;
        }

        .result-main .currency-text {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 6px;
            font-style: italic;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row .label {
            color: #666;
            font-size: 14px;
        }

        .result-row .value {
            font-weight: 600;
            font-size: 15px;
        }

        .diff-equal {
            color: #2e7d32;
        }

        .diff-unequal {
            color: #d32f2f;
        }

        /* Denomination Grid */
        .denom-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .denom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e3f2fd;
        }

        .denom-header h2 {
            color: #1565c0;
            font-size: 15px;
            font-weight: 600;
        }

        .total-badge {
            background: #e3f2fd;
            color: #1565c0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .denom-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .denom-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .denom-item:focus-within {
            border-color: #1e88e5;
            background: #f0f7ff;
        }

        .denom-item .denom-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .denom-item .denom-value {
            font-weight: 700;
            font-size: 16px;
            color: #1565c0;
        }

        .denom-item .denom-unit {
            font-size: 11px;
            color: #888;
        }

        .denom-item input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
        }

        .denom-item input:focus {
            outline: none;
            border-color: #1e88e5;
            background: white;
        }

        .denom-item input::placeholder {
            color: #ccc;
            font-weight: 400;
        }

        /* Action Buttons */
        .action-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .btn-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1565c0;
            color: white;
        }

        .btn-primary:hover {
            background: #1976d2;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-success:hover {
            background: #c8e6c9;
        }

        .btn-danger {
            background: #ffebee;
            color: #d32f2f;
        }

        .btn-danger:hover {
            background: #ffcdd2;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-full {
            grid-column: span 2;
        }

        /* History */
        .history-card {
            background: white;
            border-radius: 16px;
            margin-top: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 2px solid #e3f2fd;
        }

        .history-header h2 {
            color: #1565c0;
            font-size: 15px;
            font-weight: 600;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-sm-export {
            background: #e3f2fd;
            color: #1565c0;
        }

        .btn-sm-clear {
            background: #ffebee;
            color: #d32f2f;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .history-item-header .time {
            font-size: 12px;
            color: #888;
        }

        .history-item-header .diff {
            font-weight: 700;
            font-size: 15px;
        }

        .history-item-details {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #666;
        }

        .history-empty {
            padding: 40px;
            text-align: center;
            color: #aaa;
        }

        .history-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Install Banner */
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1565c0 0%, #1976d2 100%);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .install-banner.hidden {
            display: none;
        }

        .install-banner p {
            font-size: 13px;
        }

        .install-btn {
            background: white;
            color: #1565c0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 20px;
            }
            .action-card, .denom-card, .install-banner, .history-card, .toast, header {
                display: none !important;
            }
            .result-card {
                box-shadow: none;
                border: 2px solid #ddd;
            }
        }

        @media (max-width: 400px) {
            .denom-grid {
                grid-template-columns: 1fr;
            }
            .btn-row {
                grid-template-columns: 1fr;
            }
            .btn-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KIỂM QUỸ</h1>
            <p>thienkim.id.vn</p>
        </header>

        <!-- Expected Input -->
        <div class="result-card" style="margin-bottom: 12px;">
            <div class="expected-input-wrapper">
                <label>Nhập số tiền dự kiến để so sánh</label>
                <input type="text" id="expectedInput" placeholder="0" oninput="onExpectedChange(this)">
            </div>
        </div>

        <!-- Result Card -->
        <div class="result-card">
            <div class="result-main">
                <div class="label">Tổng tiền thực tế</div>
                <div class="amount" id="totalAmount">0đ</div>
                <div class="currency-text" id="currencyText">Không đồng</div>
            </div>

            <div class="result-row">
                <span class="label">Số tiền dự kiến</span>
                <span class="value" id="expectedAmount">0đ</span>
            </div>
            <div class="result-row">
                <span class="label">Chênh lệch</span>
                <span class="value" id="diffAmount">0đ</span>
            </div>
            <div class="result-row">
                <span class="label">Chênh lệch bằng chữ</span>
                <span class="value" id="diffText">Không đồng</span>
            </div>
        </div>

        <!-- Denomination Grid -->
        <div class="denom-card">
            <div class="denom-header">
                <h2>MỆNH GIÁ</h2>
                <span class="total-badge" id="denomCount">0 mục</span>
            </div>
            <div class="denom-grid" id="denomGrid"></div>
        </div>

        <!-- Actions -->
        <div class="action-card">
            <div class="btn-row">
                <button class="btn btn-success" onclick="copyResult()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Sao chép
                </button>
                <button class="btn btn-primary" onclick="printResult()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    In
                </button>
                <button class="btn btn-secondary" onclick="saveRecord()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
                    Lưu lịch sử
                </button>
                <button class="btn btn-danger" onclick="clearAll()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Xóa
                </button>
            </div>
        </div>

        <!-- History -->
        <div class="history-card">
            <div class="history-header">
                <h2>LỊCH SỬ</h2>
                <div class="history-actions">
                    <button class="btn-sm btn-sm-export" onclick="exportHistory()">Xuất Excel</button>
                    <button class="btn-sm btn-sm-clear" onclick="clearHistory()">Xóa</button>
                </div>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Install Banner -->
    <div id="installBanner" class="install-banner hidden">
        <p>Cài app để dùng offline</p>
        <button class="install-btn" onclick="installApp()">Cài đặt</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Denominations data
        const denominations = [
            { value: 500000, label: '500K', unit: '500.000đ' },
            { value: 200000, label: '200K', unit: '200.000đ' },
            { value: 100000, label: '100K', unit: '100.000đ' },
            { value: 50000, label: '50K', unit: '50.000đ' },
            { value: 20000, label: '20K', unit: '20.000đ' },
            { value: 10000, label: '10K', unit: '10.000đ' },
            { value: 5000, label: '5K', unit: '5.000đ' },
            { value: 2000, label: '2K', unit: '2.000đ' },
            { value: 1000, label: '1K', unit: '1.000đ' },
            { value: 500, label: '500', unit: '500đ' },
            { value: 200, label: '200', unit: '200đ' },
            { value: 100, label: '100', unit: '100đ' }
        ];

        let counts = new Array(denominations.length).fill(0);
        let deferredPrompt = null;
        let expectedValue = 0;

        // Format input as currency while typing
        function onExpectedChange(input) {
            const raw = input.value.replace(/[^\d]/g, '');
            expectedValue = parseInt(raw) || 0;
            input.value = new Intl.NumberFormat('vi-VN').format(raw);
            calculate();
        }

        // Number to Vietnamese currency text
        function numberToVietnameseText(num) {
            if (num === 0) return 'Không đồng';
            
            const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ'];
            const ones = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
            const tens = ['', 'mười', 'hai mươi', 'ba mươi', 'bốn mươi', 'năm mươi', 'sáu mươi', 'bảy mươi', 'tám mươi', 'chín mươi'];

            function readThreeDigits(n, isLast = true) {
                if (n === 0) return '';
                
                let result = '';
                const hundred = Math.floor(n / 100);
                const remainder = n % 100;
                
                if (hundred > 0) {
                    result += ones[hundred] + ' trăm';
                }
                
                if (remainder > 0) {
                    if (hundred > 0 && remainder < 10) {
                        result += ' linh';
                    }
                    
                    const ten = Math.floor(remainder / 10);
                    const one = remainder % 10;
                    
                    if (ten === 0) {
                        if (hundred > 0) {
                            result += ' lẻ';
                        }
                        result += ' ' + ones[one];
                    } else if (ten === 1) {
                        if (hundred > 0) {
                            result += ' ';
                        }
                        result += 'mười';
                        if (one > 0) {
                            result += ' ' + ones[one];
                        }
                    } else {
                        result += ' ' + tens[ten];
                        if (one > 0) {
                            if (one === 1) {
                                result += ' mốt';
                            } else if (one === 5) {
                                result += ' lăm';
                            } else {
                                result += ' ' + ones[one];
                            }
                        }
                    }
                } else if (hundred > 0) {
                    result += ' đồng';
                }
                
                return result.trim();
            }

            // Split into groups of 3 digits
            const groups = [];
            let temp = num;
            while (temp > 0) {
                groups.push(temp % 1000);
                temp = Math.floor(temp / 1000);
            }

            if (groups.length === 0) return 'Không đồng';

            let result = '';
            for (let i = groups.length - 1; i >= 0; i--) {
                const groupText = readThreeDigits(groups[i], i === groups.length - 1);
                if (groupText) {
                    if (result && groups[i] < 100 && groups[i] > 0) {
                        // Add leading zero for middle groups like 050
                        if (groups[i] < 10) {
                            result += ' không trăm linh ' + ones[groups[i]];
                        } else {
                            result += ' không trăm ' + readThreeDigits(groups[i]).trim();
                        }
                    } else {
                        result += (result ? ' ' : '') + groupText;
                    }
                    
                    if (i > 0) {
                        result += ' ' + units[i];
                    }
                }
            }

            // Clean up and format
            result = result.replace(/\s+/g, ' ').trim();
            result = result.charAt(0).toUpperCase() + result.slice(1);
            
            if (!result.endsWith('đồng') && !result.endsWith('chẵn')) {
                result += ' đồng chẵn';
            }
            
            return result;
        }

        // Format currency
        function formatCurrency(num) {
            return new Intl.NumberFormat('vi-VN').format(num) + 'đ';
        }

        // Render denomination grid
        function renderDenominations() {
            const grid = document.getElementById('denomGrid');
            grid.innerHTML = denominations.map((d, i) => `
                <div class="denom-item">
                    <div class="denom-label">
                        <span class="denom-value">${d.label}</span>
                        <span class="denom-unit">${d.unit}</span>
                    </div>
                    <input type="text" 
                           id="input-${i}" 
                           value="${counts[i] || ''}" 
                           placeholder="0"
                           inputmode="numeric"
                           oninput="updateCount(${i}, this.value)"
                           onfocus="this.select()">
                </div>
            `).join('');
        }

        // Update count for a denomination
        function updateCount(index, value) {
            const num = parseInt(value) || 0;
            counts[index] = num;
            
            // Keep only one digit after cursor when typing
            const input = document.getElementById(`input-${index}`);
            const cursorPos = input.selectionStart;
            const oldLength = input.value.length;
            input.value = num || '';
            const newLength = input.value.length;
            
            // Adjust cursor position
            const newPos = Math.max(0, cursorPos + (newLength - oldLength));
            input.setSelectionRange(newPos, newPos);
            
            calculate();
        }

        // Calculate totals
        function calculate() {
            let total = 0;
            let filledCount = 0;
            
            counts.forEach((count, i) => {
                if (count > 0) {
                    total += count * denominations[i].value;
                    filledCount++;
                }
            });

            const diff = total - expectedValue;
            
            // Update total amount
            document.getElementById('totalAmount').textContent = formatCurrency(total);
            document.getElementById('currencyText').textContent = numberToVietnameseText(total);
            
            // Update expected
            document.getElementById('expectedAmount').textContent = formatCurrency(expectedValue);
            
            // Update difference with proper styling
            const diffEl = document.getElementById('diffAmount');
            const diffTextEl = document.getElementById('diffText');
            
            if (diff === 0) {
                diffEl.textContent = '0đ';
                diffEl.className = 'value diff-equal';
                diffTextEl.textContent = 'Không đồng';
                diffTextEl.className = 'value diff-equal';
            } else {
                const absDiff = Math.abs(diff);
                const sign = diff > 0 ? '+' : '-';
                diffEl.textContent = sign + formatCurrency(absDiff);
                diffEl.className = 'value diff-unequal';
                diffTextEl.textContent = numberToVietnameseText(absDiff);
                diffTextEl.className = 'value diff-unequal';
            }
            
            // Update count badge
            document.getElementById('denomCount').textContent = `${filledCount} mục`;
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Copy result to clipboard
        function copyResult() {
            const total = document.getElementById('totalAmount').textContent;
            const text = document.getElementById('currencyText').textContent;
            const now = new Date().toLocaleString('vi-VN');
            
            const copyText = `📋 KIỂM QUỸ - ${now}\n\n💰 Tổng tiền: ${total}\n📝 Bằng chữ: ${text}`;
            
            navigator.clipboard.writeText(copyText).then(() => {
                showToast('Đã sao chép!');
            });
        }

        // Print result
        function printResult() {
            window.print();
        }

        // Save to history
        function saveRecord() {
            const total = counts.reduce((sum, c, i) => sum + c * denominations[i].value, 0);
            if (total === 0) {
                showToast('Chưa có dữ liệu để lưu!');
                return;
            }

            const diff = total - expectedValue;
            const records = JSON.parse(localStorage.getItem('kimquy_history') || '[]');
            const now = new Date();
            
            records.unshift({
                id: Date.now(),
                date: now.toISOString(),
                time: now.toLocaleString('vi-VN'),
                total,
                expected: expectedValue,
                diff,
                currencyText: numberToVietnameseText(total),
                diffText: diff === 0 ? 'Không đồng' : numberToVietnameseText(Math.abs(diff)),
                details: denominations.map((d, i) => ({
                    label: d.label,
                    count: counts[i],
                    subtotal: counts[i] * d.value
                })).filter(d => d.count > 0)
            });

            localStorage.setItem('kimquy_history', JSON.stringify(records));
            renderHistory();
            showToast('Đã lưu lịch sử!');
        }

        // Render history
        function renderHistory() {
            const records = JSON.parse(localStorage.getItem('kimquy_history') || '[]');
            const list = document.getElementById('historyList');

            if (records.length === 0) {
                list.innerHTML = `
                    <div class="history-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p>Chưa có lịch sử</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = records.slice(0, 20).map(r => {
                const diffClass = r.diff === 0 ? 'diff-equal' : 'diff-unequal';
                const diffText = r.diff === 0 ? 'Cân đối' : (r.diff > 0 ? '+' : '') + formatCurrency(r.diff);
                return `
                <div class="history-item">
                    <div class="history-item-header">
                        <span class="time">${r.time}</span>
                        <span class="diff ${diffClass}">${diffText}</span>
                    </div>
                    <div class="history-item-details">
                        <span>Thực tế: ${formatCurrency(r.total)}</span>
                        <span>Dự kiến: ${formatCurrency(r.expected)}</span>
                    </div>
                </div>
            `}).join('');
        }

        // Clear all inputs
        function clearAll() {
            counts = new Array(denominations.length).fill(0);
            renderDenominations();
            calculate();
            showToast('Đã xóa');
        }

        // Clear history
        function clearHistory() {
            if (confirm('Xóa toàn bộ lịch sử?')) {
                localStorage.removeItem('kimquy_history');
                renderHistory();
                showToast('Đã xóa lịch sử');
            }
        }

        // Export history to CSV
        function exportHistory() {
            const records = JSON.parse(localStorage.getItem('kimquy_history') || '[]');
            if (records.length === 0) {
                showToast('Không có dữ liệu!');
                return;
            }

            let csv = '\uFEFF'; // BOM
            csv += 'Thời gian,Tổng tiền,Dự kiến,Chênh lệch,Bằng chữ\n';
            records.forEach(r => {
                csv += `"${r.time}",${r.total},${r.expected},${r.diff},"${r.diff === 0 ? 'Cân đối' : r.diffText}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kim-quy-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Đã xuất Excel!');
        }

        // PWA Install
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.remove('hidden');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showToast('Cài đặt thành công!');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBanner').classList.add('hidden');
                });
            }
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW failed'));
        }

        // Initialize
        renderDenominations();
        renderHistory();
    </script>
</body>
</html>
