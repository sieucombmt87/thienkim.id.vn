<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm Quỹ Pro - THIENKIM</title><link rel="stylesheet" href="./style.css?v=TKver4.6"></head>
<body><main class="tk-app-shell cash-app">
<div class="tk-app-top"><a class="tk-back" href="../index.html">← App Center</a><h1 class="tk-app-title">💲 Kiểm Quỹ Pro</h1><button class="tk-btn ghost" id="modeBtn">Mobile Mode</button></div>
<section class="tk-card actions"><button class="tk-btn red" id="clearBtn">🗑 Xóa</button><button class="tk-btn ghost" id="historyBtn">🔐 Lịch sử</button><button class="tk-btn green" id="voiceBtn">🎙 Giọng nói</button></section>
<section class="tk-card table-card"><table class="cash-table"><thead><tr><th>Mệnh giá</th><th>SL</th><th>Thành tiền</th></tr></thead><tbody id="cashRows"></tbody></table></section>
<section class="mobile-counter hidden" id="mobileCounter"><button id="prevDenom">‹</button><div><b id="currentDenom">500k</b><strong id="currentQty">0</strong><small>Chạm + / - để đếm nhanh</small></div><button id="nextDenom">›</button><button id="minusBtn">-</button><button id="plusBtn">+</button></section>
<section class="cash-summary"><div><b>Tổng đếm:</b><strong id="countTotal">0</strong></div><div><b>Hệ thống:</b><input id="systemTotal" inputmode="numeric" placeholder="Nhập..."></div><hr><div><b>Chênh lệch:</b><strong id="diffTotal">0</strong></div><button class="tk-btn green" id="saveBtn">Lưu lịch sử</button></section>
<section class="tk-card hidden" id="historyBox"><h2>Lịch sử kiểm quỹ</h2><div id="historyList"></div></section>
</main><script src="./app.js?v=TKver4.6"></script><div id="buildVersion">TKver4.6</div></body></html>
